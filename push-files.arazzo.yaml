arazzo: "1.0.1"
info:
  title: "Push files to a GitHub repository"
  summary: "Commit and push files to a GitHub repository branch"
  version: "3.0.0"
  description: >
    Describes the MCP tool `push_files` workflow using the Git Data API.
    Pushes one or more files to a branch in a GitHub repository.
    If the target branch does not yet exist, it is automatically
    created from the repository's default branch before the files
    are committed.

sourceDescriptions:
  - name: github-api
    type: openapi
    url: ./api.github.com.2022-11-28.openapi.yaml

components:
  parameters:
    owner:
      name: owner
      in: path
      value: $inputs.owner
    repo:
      name: repo
      in: path
      value: $inputs.repo

workflows:
  # ──────────────────────────────────────────────
  # Main workflow — entry point
  # ──────────────────────────────────────────────
  - workflowId: pushFiles
    summary: Push files to a branch, creating it if it does not exist
    description: >
      Pushes files to the target branch. If the branch does not exist,
      it is created from the repository's default branch before committing.
    inputs:
      type: object
      properties:
        owner:
          type: string
          description: Repository owner
        repo:
          type: string
          description: Repository name
        branch:
          type: string
          description: Target branch name
        commitMessage:
          type: string
          description: Commit message
        files:
          type: array
          description: "Files to push (each entry: path + content)"
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
      required:
        - owner
        - repo
        - branch
        - commitMessage
        - files
    steps:
      # ── Step 1: resolve target branch ──
      - stepId: getBranchRef
        operationId: git/get-ref
        description: >
          Resolve the current HEAD of the target branch.
          If the branch does not exist, the workflow falls back to
          creating it from the default branch.
        parameters:
          - reference: $components.parameters.owner
          - reference: $components.parameters.repo
          - name: ref
            in: path
            value: heads/$inputs.branch
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          - name: branchNotFound
            type: goto
            workflowId: createBranchAndPushFiles
            criteria:
              - condition: $statusCode == 404
        outputs:
          parentCommitSha: $response.body.object.sha

      # ── Step 2: delegate to shared commit-and-push workflow ──
      - stepId: commitAndPush
        workflowId: commitAndPush
        description: Commit the files and update the branch.
        parameters:
          - name: owner
            value: $inputs.owner
          - name: repo
            value: $inputs.repo
          - name: branch
            value: $inputs.branch
          - name: commitMessage
            value: $inputs.commitMessage
          - name: files
            value: $inputs.files
          - name: parentCommitSha
            value: $steps.getBranchRef.outputs.parentCommitSha
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          ref: $outputs.ref
          commitSha: $outputs.commitSha
    outputs:
      ref: $steps.commitAndPush.outputs.ref
      commitSha: $steps.commitAndPush.outputs.commitSha

  # ──────────────────────────────────────────────
  # Path B: branch does not exist
  # ──────────────────────────────────────────────
  - workflowId: createBranchAndPushFiles
    summary: Create a new branch from the default branch and push files to it
    description: >
      Handles the case where the target branch does not yet exist.
      Determines the repository's default branch, creates the target
      branch from it, then commits and pushes the files.
    inputs:
      type: object
      properties:
        owner:
          type: string
          description: Repository owner
        repo:
          type: string
          description: Repository name
        branch:
          type: string
          description: Target branch name (to be created)
        commitMessage:
          type: string
          description: Commit message
        files:
          type: array
          description: "Files to push (each entry: path + content)"
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
      required:
        - owner
        - repo
        - branch
        - commitMessage
        - files
    steps:
      # ── B1: get repo to find default branch name ──
      - stepId: getRepo
        operationId: repos/get
        description: Determine the repository's default branch name
        parameters:
          - reference: $components.parameters.owner
          - reference: $components.parameters.repo
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          defaultBranch: $response.body.default_branch

      # ── B2: resolve default branch ref ──
      - stepId: getDefaultBranchRef
        operationId: git/get-ref
        description: Resolve the current HEAD of the default branch
        parameters:
          - reference: $components.parameters.owner
          - reference: $components.parameters.repo
          - name: ref
            in: path
            value: heads/$steps.getRepo.outputs.defaultBranch
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          defaultBranchSha: $response.body.object.sha

      # ── B3: create new branch ref from default branch ──
      - stepId: createBranchRef
        operationId: git/create-ref
        description: Create the target branch based on the default branch
        parameters:
          - reference: $components.parameters.owner
          - reference: $components.parameters.repo
        requestBody:
          contentType: application/json
          payload:
            ref: refs/heads/$inputs.branch
            sha: $steps.getDefaultBranchRef.outputs.defaultBranchSha
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          parentCommitSha: $response.body.object.sha

      # ── B4: delegate to shared commit-and-push workflow ──
      - stepId: commitAndPush
        workflowId: commitAndPush
        description: Commit the files and update the newly created branch.
        parameters:
          - name: owner
            value: $inputs.owner
          - name: repo
            value: $inputs.repo
          - name: branch
            value: $inputs.branch
          - name: commitMessage
            value: $inputs.commitMessage
          - name: files
            value: $inputs.files
          - name: parentCommitSha
            value: $steps.createBranchRef.outputs.parentCommitSha
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          ref: $outputs.ref
          commitSha: $outputs.commitSha
    outputs:
      ref: $steps.commitAndPush.outputs.ref
      commitSha: $steps.commitAndPush.outputs.commitSha

  # ──────────────────────────────────────────────
  # Shared workflow: commit and push
  # ──────────────────────────────────────────────
  - workflowId: commitAndPush
    summary: Commit files and update the branch reference
    description: >
      Creates a Git commit containing the provided files and advances
      the branch to point to the new commit. Expects the parent commit
      to build upon as input.
    inputs:
      type: object
      properties:
        owner:
          type: string
          description: Repository owner
        repo:
          type: string
          description: Repository name
        branch:
          type: string
          description: Target branch name
        commitMessage:
          type: string
          description: Commit message
        files:
          type: array
          description: "Files to push (each entry: path + content)"
          items:
            type: object
            properties:
              path:
                type: string
              content:
                type: string
        parentCommitSha:
          type: string
          description: SHA of the parent commit to build upon
      required:
        - owner
        - repo
        - branch
        - commitMessage
        - files
        - parentCommitSha
    steps:
      # ── C1: get parent commit ──
      - stepId: getParentCommit
        operationId: git/get-commit
        description: Retrieve the parent commit's tree as base for the new file tree
        parameters:
          - reference: $components.parameters.owner
          - reference: $components.parameters.repo
          - name: commit_sha
            in: path
            value: $inputs.parentCommitSha
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          baseTreeSha: $response.body.tree.sha

      # ── C2: create tree ──
      - stepId: createTree
        operationId: git/create-tree
        description: >
          Create a new file tree containing the provided files,
          based on the parent commit's tree.
        parameters:
          - reference: $components.parameters.owner
          - reference: $components.parameters.repo
        requestBody:
          contentType: application/json
          payload:
            base_tree: $steps.getParentCommit.outputs.baseTreeSha
            tree: $inputs.files
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          newTreeSha: $response.body.sha

      # ── C3: create commit ──
      - stepId: createCommit
        operationId: git/create-commit
        description: Create a commit with the new file tree and the given message
        parameters:
          - reference: $components.parameters.owner
          - reference: $components.parameters.repo
        requestBody:
          contentType: application/json
          payload:
            message: $inputs.commitMessage
            tree: $steps.createTree.outputs.newTreeSha
            parents:
              - $inputs.parentCommitSha
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          newCommitSha: $response.body.sha

      # ── C4: update branch ref ──
      - stepId: updateBranchRef
        operationId: git/update-ref
        description: Advance the branch to point to the new commit
        parameters:
          - reference: $components.parameters.owner
          - reference: $components.parameters.repo
          - name: ref
            in: path
            value: heads/$inputs.branch
        requestBody:
          contentType: application/json
          payload:
            sha: $steps.createCommit.outputs.newCommitSha
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          updatedRef: $response.body.ref
          finalCommitSha: $response.body.object.sha
    outputs:
      ref: $steps.updateBranchRef.outputs.updatedRef
      commitSha: $steps.updateBranchRef.outputs.finalCommitSha
